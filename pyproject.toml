[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yawarakame-dialogue"
version = "0.1.0"
description = "OpenAI Responses APIを使った、やわらかめ対談CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.99,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
yawarakame = "yawarakame.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yawarakame = ["data/characters/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

